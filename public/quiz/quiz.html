        { question: "What is the main duty of the judiciary?", options: ["Making laws", "Interpreting laws", "Conducting elections", "Collecting taxes"], answer: "Interpreting laws" },
        { question: "What does patriotism mean?", options: ["Love and loyalty to one's country", "Hating other countries", "Breaking laws", "Avoiding responsibilities"], answer: "Love and loyalty to one's country" },
        {question:"Which of the following is the current constitution of the Federal Republic of Nigeria?",options:["1979 Constitution","1963 Constitution","1999 Constitution","1960 Constitution"],answer:"1999 Constitution"},

        { question:"Pipeline transportation is suitable for conveying"}

// QUIZ VARIABLES
let currentSubject = "";
let questions = [];
let currentQuestion = 0;
let score = 0;
let timeLeft = 300;
let timerInterval;
let quizFinished = false;


// ACCOUNT-SCOPED QUIZ POINTS
function getStudentHubAccountId() {
    const directUsers = [
        window.currentUser,
        window.loggedInUser,
        window.studentHubUser,
        window.user
    ];

    for (const candidate of directUsers) {
        if (candidate && typeof candidate === "object") {
            const id = candidate.id || candidate.user_id ||
                candidate.userId || candidate.email || candidate.username;

            if (id !== undefined && id !== null && String(id).trim()) {
                return String(id).trim();
            }
        }
    }

    const possibleKeys = [
        "studentHubUser", "currentUser", "loggedInUser", "user", "userData"
    ];

    for (const storage of [localStorage, sessionStorage]) {
        for (const key of possibleKeys) {
            const stored = storage.getItem(key);
            if (!stored) continue;

            try {
                const parsed = JSON.parse(stored);

                if (parsed && typeof parsed === "object") {
                    const id = parsed.id || parsed.user_id ||
                        parsed.userId || parsed.email || parsed.username;

                    if (id !== undefined && id !== null && String(id).trim()) {
                        return String(id).trim();
                    }
                }
            } catch (error) {
                // Ignore values that are not JSON user objects.
            }
        }
    }

    return "guest";
}

const quizAccountId = getStudentHubAccountId();

const quizPointsStorageKey =
    "studentHubQuizPoints_" + encodeURIComponent(quizAccountId);

let totalQuizPoints =
    Number(localStorage.getItem(quizPointsStorageKey)) || 0;


function updateQuizPoints() {
    const pointsElement = document.getElementById("totalQuizPoints");

    if (pointsElement) {
        pointsElement.textContent = totalQuizPoints.toLocaleString();
    }
}

updateQuizPoints();


// COIN SOUND
let rewardAudioContext = null;

function playCoinSound() {
    try {
        const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) return;

        if (!rewardAudioContext) {
            rewardAudioContext = new AudioContextClass();
        }

        const audio = rewardAudioContext;

        if (audio.state === "suspended") {
            audio.resume();
        }

        const oscillator = audio.createOscillator();
        const gain = audio.createGain();

        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(720, audio.currentTime);

        oscillator.frequency.exponentialRampToValueAtTime(
            1450, audio.currentTime + 0.13
        );

        gain.gain.setValueAtTime(0.09, audio.currentTime);

        gain.gain.exponentialRampToValueAtTime(
            0.001, audio.currentTime + 0.2
        );

        oscillator.connect(gain);
        gain.connect(audio.destination);

        oscillator.start();
        oscillator.stop(audio.currentTime + 0.2);

    } catch (error) {
        console.warn("Coin sound could not play:", error);
    }
}


// FLYING COINS + POINTS POPUP
function animateCoins(points) {
    if (!points || points <= 0) return;

    const container = document.createElement("div");
    container.className = "coin-rain";
    document.body.appendChild(container);

    for (let i = 0; i < 35; i++) {
        const coin = document.createElement("span");

        coin.className = "flying-coin";
        coin.textContent = "🪙";

        coin.style.setProperty(
            "--x",
            ((Math.random() - 0.5) * 650) + "px"
        );

        coin.style.setProperty(
            "--y",
            ((Math.random() - 0.5) * 620) + "px"
        );

        coin.style.animationDelay = (Math.random() * 0.35) + "s";

        container.appendChild(coin);

        window.setTimeout(playCoinSound, i * 35);
    }

    const popup = document.createElement("div");
    popup.className = "points-popup";
    popup.textContent = "+" + points + " POINTS!";

    document.body.appendChild(popup);

    window.setTimeout(() => container.remove(), 2300);
    window.setTimeout(() => popup.remove(), 1900);
}


// RANDOM QUESTION FUNCTION
function shuffleQuestions(array) {
    const shuffled = [...array];

    for (let i = shuffled.length - 1; i > 0; i--) {
        const randomIndex = Math.floor(Math.random() * (i + 1));

        [shuffled[i], shuffled[randomIndex]] =
            [shuffled[randomIndex], shuffled[i]];
    }

    return shuffled;
}


// START QUIZ
function startQuiz(subject) {
    currentSubject = subject;

    questions = shuffleQuestions(quizData[subject]);

    currentQuestion = 0;
    score = 0;
    timeLeft = 300;
    quizFinished = false;

    document.getElementById("subjectArea").style.display = "none";
    document.getElementById("quizArea").style.display = "block";
    document.getElementById("result").style.display = "none";

    document.getElementById("subjectTitle").textContent =
        subject + " Quiz";

    showQuestion();
    startTimer();
}


// SHOW QUESTION
function showQuestion() {
    const q = questions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        "Question " + (currentQuestion + 1) + " of " + questions.length;

    document.getElementById("question").textContent = q.question;

    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    q.options.forEach(function(option) {
        const button = document.createElement("button");

        button.textContent = option;
        button.className = "option";

        button.onclick = function() {
            selectAnswer(option);
        };

        optionsDiv.appendChild(button);
    });
}


// CHECK ANSWER
function selectAnswer(answer) {
    if (quizFinished) return;

    if (answer === questions[currentQuestion].answer) {
        score++;
    }

    nextQuestion();
}


// NEXT QUESTION
function nextQuestion() {
    currentQuestion++;

    if (currentQuestion >= questions.length) {
        finishQuiz();
        return;
    }

    showQuestion();
}


// TIMER
function startTimer() {
    clearInterval(timerInterval);

    document.getElementById("timer").textContent = "5:00";

    timerInterval = setInterval(function() {
        timeLeft--;

        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;

        document.getElementById("timer").textContent =
            minutes + ":" + String(seconds).padStart(2, "0");

        if (timeLeft <= 0) {
            finishQuiz();
        }
    }, 1000);
}


// FINISH QUIZ
function finishQuiz() {
    if (quizFinished) return;

    quizFinished = true;
    clearInterval(timerInterval);

    document.getElementById("quizArea").style.display = "none";
    document.getElementById("result").style.display = "block";

    const percentage = questions.length
        ? Math.round((score / questions.length) * 100)
        : 0;

    // Earn 1 point for each percentage point scored.
    const pointsEarned = percentage;

    totalQuizPoints += pointsEarned;

    localStorage.setItem(
        quizPointsStorageKey,
        String(totalQuizPoints)
    );

    updateQuizPoints();
    animateCoins(pointsEarned);

    document.getElementById("score").textContent =
        "Score: " + score + " / " + questions.length;

    document.getElementById("percentage").textContent =
        "Percentage: " + percentage + "% | Points Earned: " +
        pointsEarned + " | Total Points: " + totalQuizPoints;
}


// GO BACK
function goBack() {
    clearInterval(timerInterval);

    document.getElementById("quizArea").style.display = "none";
    document.getElementById("subjectArea").style.display = "block";
}
</script>

</html>
